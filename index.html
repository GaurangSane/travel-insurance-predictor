<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Travel Insurance Prediction</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        linear-gradient(rgba(0, 0, 0, 0.65),
          rgba(0, 0, 0, 0.65)),
        url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=1974&auto=format&fit=crop');

      background-size: cover;
      background-position: center;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 30px;
    }

    .container {
      width: 100%;
      max-width: 900px;

      background: rgba(15, 23, 42, 0.85);

      backdrop-filter: blur(18px);

      border: 1px solid rgba(255, 255, 255, 0.1);

      border-radius: 28px;

      padding: 40px;

      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.5),
        0 0 50px rgba(14, 165, 233, 0.15);

      animation: fadeIn 0.7s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(25px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .title-section {
      text-align: center;
      margin-bottom: 35px;
    }

    .title-section h1 {
      font-size: 42px;
      color: white;
      margin-bottom: 10px;
    }

    .title-section span {
      color: #38bdf8;
    }

    .title-section p {
      color: #cbd5e1;
      font-size: 15px;
      line-height: 1.6;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 22px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group label {
      color: #f8fafc;
      margin-bottom: 10px;
      font-size: 14px;
      font-weight: 500;
    }

    input,
    select {
      width: 100%;

      padding: 14px 16px;

      border-radius: 14px;

      border: 1px solid rgba(255, 255, 255, 0.08);

      background: rgba(255, 255, 255, 0.06);

      color: white;

      font-size: 15px;

      transition: all 0.3s ease;

      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #38bdf8;

      box-shadow:
        0 0 0 3px rgba(56, 189, 248, 0.2);

      transform: translateY(-2px);
    }

    input::placeholder {
      color: #cbd5e1;
    }

    select option {
      color: black;
    }

    .full-width {
      grid-column: span 2;
    }

    .predict-btn {
      width: 100%;

      padding: 17px;

      border: none;

      border-radius: 16px;

      background: linear-gradient(135deg, #0ea5e9, #2563eb);

      color: white;

      font-size: 18px;

      font-weight: 600;

      cursor: pointer;

      transition: 0.3s ease;

      margin-top: 10px;

      box-shadow:
        0 10px 25px rgba(37, 99, 235, 0.35);
    }

    .predict-btn:hover {
      transform: translateY(-3px) scale(1.01);

      box-shadow:
        0 15px 30px rgba(37, 99, 235, 0.45);
    }

    .loading {
      text-align: center;

      margin-top: 22px;

      color: #38bdf8;

      display: none;

      font-size: 18px;

      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0% {
        opacity: 0.4;
      }

      50% {
        opacity: 1;
      }

      100% {
        opacity: 0.4;
      }
    }

    .result {
      margin-top: 28px;

      padding: 24px;

      border-radius: 18px;

      text-align: center;

      display: none;

      font-size: 22px;

      font-weight: 600;

      animation: fadeIn 0.5s ease;
    }

    .success {
      background: rgba(34, 197, 94, 0.15);

      border: 1px solid rgba(34, 197, 94, 0.4);

      color: #86efac;
    }

    .danger {
      background: rgba(239, 68, 68, 0.15);

      border: 1px solid rgba(239, 68, 68, 0.4);

      color: #fca5a5;
    }

    .footer-text {
      text-align: center;
      margin-top: 28px;
      color: #94a3b8;
      font-size: 13px;
    }

    @media(max-width: 768px) {

      .container {
        padding: 28px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .full-width {
        grid-column: span 1;
      }

      .title-section h1 {
        font-size: 30px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="title-section">

      <h1>
        ✈️ Travel Insurance
        <span>Prediction</span>
      </h1>

      <p>
        Smart AI-powered insurance prediction system using Machine Learning.
      </p>

    </div>

    <form id="predictionForm">

      <div class="form-grid">

        <div class="form-group">
          <label>Age</label>

          <input
            type="number"
            id="Age"
            placeholder="Enter your age"
            required>
        </div>

        <div class="form-group">
          <label>Employment Type</label>

          <select id="Employment_type" required>

            <option value="">Select Employment Type</option>

            <option value="Government Sector">
              Government Sector
            </option>

            <option value="Private Sector/Self Employed">
              Private Sector/Self Employed
            </option>

          </select>
        </div>

        <div class="form-group">
          <label>Graduated</label>

          <select id="graduated" required>

            <option value="">Select</option>

            <option value="Yes">Yes</option>

            <option value="No">No</option>

          </select>
        </div>

        <div class="form-group">
          <label>Chronic Disease</label>

          <select id="cronic_disease" required>

            <option value="">Select</option>

            <option value="Yes">Yes</option>

            <option value="No">No</option>

          </select>
        </div>

        <div class="form-group">
          <label>Frequent Flyer</label>

          <select id="frequent_flyer" required>

            <option value="">Select</option>

            <option value="Yes">Yes</option>

            <option value="No">No</option>

          </select>
        </div>

        <div class="form-group">
          <label>Ever Travelled Abroad</label>

          <select id="ever_travelled_abroad" required>

            <option value="">Select</option>

            <option value="Yes">Yes</option>

            <option value="No">No</option>

          </select>
        </div>

        <div class="form-group">
          <label>Annual Income</label>

          <input
            type="number"
            id="annual_income"
            placeholder="Enter annual income"
            required>
        </div>

        <div class="form-group">
          <label>Family Members</label>

          <input
            type="number"
            id="family_members"
            placeholder="Enter family members"
            required>
        </div>

        <div class="full-width">

          <button
            type="submit"
            class="predict-btn">

            🚀 Predict Insurance Eligibility

          </button>

        </div>

      </div>

    </form>

    <div
      class="loading"
      id="loading">

      🔄 Predicting with AI Model...

    </div>

    <div
      class="result"
      id="result">

    </div>

    <div class="footer-text">

      Built using FastAPI + Machine Learning + Frontend Integration

    </div>

  </div>

  <script>

    const form = document.getElementById("predictionForm");

    const resultDiv = document.getElementById("result");

    const loading = document.getElementById("loading");

    form.addEventListener("submit", async (e) => {

      e.preventDefault();

      resultDiv.style.display = "none";

      loading.style.display = "block";

      const data = {

        Age: parseInt(
          document.getElementById("Age").value
        ),

        Employment_type:
          document.getElementById("Employment_type").value,

        graduated:
          document.getElementById("graduated").value,

        cronic_disease:
          document.getElementById("cronic_disease").value,

        frequent_flyer:
          document.getElementById("frequent_flyer").value,

        ever_travelled_abroad:
          document.getElementById("ever_travelled_abroad").value,

        annual_income:
          parseFloat(
            document.getElementById("annual_income").value
          ),

        family_members:
          parseInt(
            document.getElementById("family_members").value
          )

      };

      try {

        const response = await fetch(
          "/predict",
          {

            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify(data)

          }
        );

        const responseText = await response.text();

        let result;

        try {

            result = JSON.parse(responseText);

        }

        catch {

            throw new Error(responseText);
        }

        console.log("FULL BACKEND RESPONSE:", result);

        loading.style.display = "none";

        resultDiv.style.display = "block";

        // BACKEND ERROR
        if (!response.ok) {

          resultDiv.className = "result danger";

          resultDiv.innerHTML = `
            ⚠️ Backend Error:<br><br>
            <pre style="
              white-space: pre-wrap;
              text-align: left;
              font-size: 12px;
              overflow-x: auto;
            ">${JSON.stringify(result, null, 2)}</pre>
          `;

          return;
        }

        // SUCCESS RESPONSE
        if (result.predicted === 1) {

          resultDiv.className = "result success";

          resultDiv.innerHTML = `
            ✅ Customer is likely to BUY Travel Insurance
          `;

        }

        else {

          resultDiv.className = "result danger";

          resultDiv.innerHTML = `
            ❌ Customer is NOT likely to BUY Travel Insurance
          `;
        }

      }

      catch (error) {

        loading.style.display = "none";

        resultDiv.style.display = "block";

        resultDiv.className = "result danger";

        resultDiv.innerHTML =
          `
          ⚠️ Frontend Error<br><br>
          ${error}
          `;

        console.log(error);
      }

    });

</script>
</body>

</html>
